plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	mods {
		"challenge" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			programArgs '--quickPlaySingleplayer', 'chalplay'
			vmArgs '-Xmx1280m', '-Djava.awt.headless=false'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Diagnostic: verify minecraft-merged jar before compilation
tasks.register('verifyMinecraftJar') {
	doLast {
		def minecraftJar = configurations.compileClasspath.files.find { it.name.contains('minecraft-merged') }
		if (minecraftJar) {
			println "Found minecraft-merged jar: ${minecraftJar}"
			println "Size: ${minecraftJar.length()} bytes"
			if (minecraftJar.length() < 1000) {
				throw new GradleException("minecraft-merged jar is suspiciously small (${minecraftJar.length()} bytes)")
			}
		} else {
			throw new GradleException("Could not find minecraft-merged jar in classpath")
		}
	}
}

compileJava.dependsOn verifyMinecraftJar

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.md") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
